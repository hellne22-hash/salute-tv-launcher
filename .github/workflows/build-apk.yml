name: Build Salute TV Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "SaluteTVLauncher-download.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o SaluteTVLauncher-download.zip -d extracted
          find extracted -maxdepth 5 -type f | sort | head -200
          if [ -f extracted/SaluteTVLauncher/settings.gradle ] || [ -f extracted/SaluteTVLauncher/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/SaluteTVLauncher" >> "$GITHUB_ENV"
          elif [ -f extracted/settings.gradle ] || [ -f extracted/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salute-tv-launcher-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
