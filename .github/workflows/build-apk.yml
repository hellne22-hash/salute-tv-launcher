
name: Build Salute TV Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'SaluteTVLauncher-download.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          unzip -o SaluteTVLauncher-download.zip -d extracted
          echo "Archive contents:"
          find extracted -maxdepth 3 -type f | head -100
          if [ -f extracted/SaluteTVLauncher/gradlew ]; then
            echo "PROJECT_DIR=extracted/SaluteTVLauncher" >> "$GITHUB_ENV"
          elif [ -f extracted/gradlew ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle wrapper not found in archive"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salute-tv-launcher-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
